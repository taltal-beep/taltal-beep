    .late{animation:fade .55s ease-out 4.350s backwards}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .spark{stroke-dasharray:832;animation:draw 1.1s ease-out 4.350s backwards}
    @keyframes draw{from{stroke-dashoffset:832}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){
      .cov{display:none}
      .late,.spark{animation:none}
    }
  </style>

