name: metrics

on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch: # rebuild by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

env:
  # Monochrome: strip every color the templates and plugins bake in.
  MONO_CSS: |
    foreignObject > div { filter: grayscale(100%) contrast(1.1); }
    a, .field a { color: inherit !important; }

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/overview.svg
          template: classic
          committer_message: "chore: refresh metrics (overview)"
          config_timezone: Asia/Jerusalem
          config_display: large
          config_animations: no
          extras_css: ${{ env.MONO_CSS }}
          base: header, activity, community, repositories, metadata
          base_hireable: yes
          config_order: base.header, isocalendar, languages, lines, notable, base.activity+community, base.repositories, base.metadata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: 0:#111111, 1:#333333, 2:#555555, 3:#777777, 4:#999999, 5:#aaaaaa, 6:#c4c4c4, 7:#dddddd
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile, logos, objective-c

          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_skipped: obsidian-vault

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
          plugin_notable_indepth: yes
          plugin_notable_self: no

  projects:
    runs-on: ubuntu-latest
    needs: overview # avoid two jobs pushing at once
    steps:
      - name: Projects
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/projects.svg
          template: classic
          committer_message: "chore: refresh metrics (projects)"
          config_timezone: Asia/Jerusalem
          config_display: large
          config_animations: no
          extras_css: ${{ env.MONO_CSS }}
          base: ""
          config_order: repositories, followup

          plugin_repositories: yes
          plugin_repositories_featured: taltal-beep/testosterone, hrcorval/behavex
          plugin_repositories_order: featured

          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes


  terminal:
    runs-on: ubuntu-latest
    needs: projects
    steps:
      - name: Terminal card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/terminal.svg
          template: terminal
          committer_message: "chore: refresh metrics (terminal)"
          config_timezone: Asia/Jerusalem
          config_animations: no
          extras_css: ${{ env.MONO_CSS }}
          base: header, activity, community, repositories

  contributors:
    runs-on: ubuntu-latest
    needs: terminal
    steps:
      - name: Testosterone contributors
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          repo: testosterone
          filename: metrics/contributors.svg
          template: repository
          committer_message: "chore: refresh metrics (contributors)"
          config_display: large
          config_animations: no
          extras_css: ${{ env.MONO_CSS }}
          base: header
          plugin_contributors: yes
          plugin_contributors_contributions: yes
          plugin_contributors_sections: contributors
          plugin_contributors_ignored: cursoragent, cursor[bot], github-actions[bot], dependabot[bot]
